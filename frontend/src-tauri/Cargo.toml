[package]
name = "eclipse-media-desktop"
version = "1.6.0"
description = "Eclipse Media local-first desktop application"
authors = ["Pavel Hopson <hopsintoxin@mail.ru>"]
edition = "2021"

[lib]
name = "eclipse_media_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "=2.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
