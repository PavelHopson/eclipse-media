<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eclipse Release Signal</title>
    <script
      src="vendor/gsap-3.14.2.min.js"
      integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2"
      crossorigin="anonymous"
    ></script>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030405; }
      #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #030405; }
      .scene-slot { position: absolute; inset: 0; width: 100%; height: 100%; }
      .telemetry { position: absolute; z-index: 10; right: 4vw; bottom: 3vw; color: #657791; font: 16px Consolas, monospace; letter-spacing: .14em; }
      @media (max-aspect-ratio: 1 / 1) {
        .telemetry { right: 5vw; bottom: 4vw; font-size: 13px; }
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="eclipse-release-signal" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div
        id="scene-signal-slot"
        class="scene-slot"
        data-composition-id="scene-signal"
        data-composition-src="compositions/scene-signal.html"
        data-start="0"
        data-duration="3"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-inputs-slot"
        class="scene-slot"
        data-composition-id="scene-inputs"
        data-composition-src="compositions/scene-inputs.html"
        data-start="3"
        data-duration="3"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-pipeline-slot"
        class="scene-slot"
        data-composition-id="scene-pipeline"
        data-composition-src="compositions/scene-pipeline.html"
        data-start="6"
        data-duration="3"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-quality-slot"
        class="scene-slot"
        data-composition-id="scene-quality"
        data-composition-src="compositions/scene-quality.html"
        data-start="9"
        data-duration="3"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-close-slot"
        class="scene-slot"
        data-composition-id="scene-close"
        data-composition-src="compositions/scene-close.html"
        data-start="12"
        data-duration="3"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div class="telemetry">15.0 SEC / 1920 × 1080 / LOCAL</div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['eclipse-release-signal'] = tl;
    </script>
  </body>
</html>
