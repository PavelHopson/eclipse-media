<!doctype html>
<html lang="ru">
  <head><meta charset="utf-8" /></head>
  <body>
    <template>
      <style>
        #root { --void: #030405; --ink: #f4f7fb; --signal: #6ba3ff; --signal-soft: #9dc4ff; }
        * { box-sizing: border-box; }
        #root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(circle at 76% 32%, rgba(107, 163, 255, .12), transparent 31%), var(--void); box-shadow: inset 0 0 150px rgba(0, 0, 0, .9); color: var(--ink); font-family: 'Roboto', sans-serif; }
        #root::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(107, 163, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(107, 163, 255, .035) 1px, transparent 1px); background-size: 64px 64px; opacity: .6; }
        .scene-content { position: absolute; inset: 0; display: grid; align-content: center; padding: 7vw; }
        .eyebrow { margin: 0; color: var(--signal-soft); font: 600 19px/1.2 Consolas, monospace; letter-spacing: .24em; text-transform: uppercase; }
        h2 { max-width: 1180px; margin: 25px 0 0; font-size: clamp(62px, 6vw, 112px); line-height: .95; letter-spacing: -.045em; }
        .pipeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; margin-top: 64px; }
        .pipeline-step { position: relative; min-height: 165px; padding: 28px; border: 1px solid rgba(107, 163, 255, .18); border-radius: 16px; background: linear-gradient(145deg, rgba(14, 25, 37, .95), rgba(7, 11, 17, .96)); }
        .pipeline-step:not(:last-child)::after { content: ''; position: absolute; top: 50%; right: -21px; width: 21px; height: 1px; background: linear-gradient(90deg, var(--signal), transparent); }
        .pipeline-step span { color: var(--signal); font: 500 18px Consolas, monospace; }
        .pipeline-step strong { display: block; margin-top: 36px; font-size: 28px; }
        @media (max-aspect-ratio: 1 / 1) {
          .scene-content { padding: 9vw 8vw; }
          h2 { max-width: 100%; font-size: clamp(58px, 8.2vw, 88px); }
          .pipeline { grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 38px; }
          .pipeline-step { min-height: 132px; padding: 22px; }
          .pipeline-step:not(:last-child)::after { display: none; }
          .pipeline-step strong { margin-top: 24px; font-size: 25px; }
        }
      </style>

      <div id="root" data-composition-id="scene-pipeline" data-width="1920" data-height="1080" data-duration="3">
        <div class="scene-content">
          <p class="eyebrow">02 / Operational motion</p>
          <h2>Сигнал проходит понятный pipeline.</h2>
          <div class="pipeline">
            <div class="pipeline-step"><span>01</span><strong>Extract</strong></div>
            <div class="pipeline-step"><span>02</span><strong>Compose</strong></div>
            <div class="pipeline-step"><span>03</span><strong>Validate</strong></div>
            <div class="pipeline-step"><span>04</span><strong>Render</strong></div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const root = '[data-composition-id="scene-pipeline"]';
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(`${root} .eyebrow`, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: .45, ease: 'power3.out' }, .16);
          tl.fromTo(`${root} h2`, { autoAlpha: 0, y: 36 }, { autoAlpha: 1, y: 0, duration: .65, ease: 'expo.out' }, .3);
          tl.fromTo(`${root} .pipeline-step`, { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, stagger: .12, duration: .55, ease: 'power3.out' }, .65);
          tl.fromTo(`${root} .pipeline-step`, { y: 0 }, { y: -8, stagger: .09, duration: 1.5, ease: 'sine.inOut' }, 1.2);
          tl.set(root, { autoAlpha: 0 }, 2.98);
          window.__timelines = window.__timelines || {};
          window.__timelines['scene-pipeline'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
