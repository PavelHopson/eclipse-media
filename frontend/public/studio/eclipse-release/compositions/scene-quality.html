<!doctype html>
<html lang="ru">
  <head><meta charset="utf-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'Eclipse Inter'; src: url('vendor/inter-cyrillic.woff2') format('woff2'); font-style: normal; font-weight: 100 900; font-display: block; }
        #root { --void: #030405; --ink: #f4f7fb; --muted: #8290a3; --signal: #6ba3ff; --signal-soft: #9dc4ff; --solar: #f5a623; --success: #4ae6a0; }
        * { box-sizing: border-box; }
        #root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(circle at 76% 32%, rgba(107, 163, 255, .12), transparent 31%), var(--void); box-shadow: inset 0 0 150px rgba(0, 0, 0, .9); color: var(--ink); font-family: 'Eclipse Inter', sans-serif; }
        #root::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(107, 163, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(107, 163, 255, .035) 1px, transparent 1px); background-size: 64px 64px; opacity: .6; }
        .scene-content { position: absolute; inset: 0; display: grid; align-content: center; padding: 7vw; }
        .eyebrow { margin: 0; color: var(--signal-soft); font: 600 19px/1.2 Consolas, monospace; letter-spacing: .24em; text-transform: uppercase; }
        h2 { max-width: 1180px; margin: 25px 0 0; font-size: clamp(62px, 6vw, 112px); line-height: .95; letter-spacing: -.045em; }
        .body { max-width: 980px; margin: 22px 0 0; color: var(--muted); font-size: 25px; line-height: 1.42; }
        .solar { color: var(--solar); }
        .quality-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 38px; }
        .quality-card { padding: 34px; border-top: 2px solid var(--signal); background: linear-gradient(180deg, rgba(107, 163, 255, .08), rgba(8, 13, 20, .8)); }
        .quality-card:nth-child(2) { border-color: var(--success); }
        .quality-card:nth-child(3) { border-color: var(--solar); }
        .quality-card strong { display: block; font-size: 34px; }
        .quality-card p { margin: 14px 0 0; color: var(--muted); font-size: 21px; line-height: 1.4; }
        @media (max-aspect-ratio: 1 / 1) {
          .scene-content { padding: 9vw 8vw; }
          h2 { max-width: 100%; font-size: clamp(58px, 8.2vw, 88px); }
          .quality-grid { grid-template-columns: 1fr; gap: 12px; margin-top: 34px; }
          .quality-card { padding: 22px; }
          .quality-card strong { font-size: 27px; }
          .quality-card p { margin-top: 8px; font-size: 18px; }
        }
      </style>

      <div id="root" data-composition-id="scene-quality" data-width="1920" data-height="1080" data-duration="3">
        <div class="scene-content">
          <p class="eyebrow"><!--release:eyebrow:start-->03 / Quality gate<!--release:eyebrow:end--></p>
          <h2><!--release:headline:start-->Креатив не отменяет контроль.<!--release:headline:end--></h2>
          <p class="body"><!--release:body:start-->Перед рендером проверьте смысл, данные и соответствие реальному продукту.<!--release:body:end--></p>
          <div class="quality-grid">
            <div class="quality-card"><strong>Deterministic</strong><p>Одинаковые входы дают одинаковые кадры.</p></div>
            <div class="quality-card"><strong>Validated</strong><p>Lint и runtime check до тяжёлого render.</p></div>
            <div class="quality-card"><strong>Reviewed</strong><p>Публикация только после просмотра человеком.</p></div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const root = '[data-composition-id="scene-quality"]';
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(`${root} .eyebrow`, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: .45, ease: 'power3.out' }, .16);
          tl.fromTo(`${root} h2`, { autoAlpha: 0, y: 36 }, { autoAlpha: 1, y: 0, duration: .65, ease: 'expo.out' }, .3);
          tl.fromTo(`${root} .body`, { autoAlpha: 0, y: 22 }, { autoAlpha: 1, y: 0, duration: .5, ease: 'power3.out' }, .54);
          tl.fromTo(`${root} .quality-card`, { autoAlpha: 0, scale: .94 }, { autoAlpha: 1, scale: 1, stagger: .14, duration: .55, ease: 'back.out(1.3)' }, .68);
          tl.fromTo(`${root} .quality-card`, { borderTopWidth: 2 }, { borderTopWidth: 6, stagger: .12, duration: 1.2, ease: 'sine.inOut' }, 1.25);
          tl.set(root, { autoAlpha: 0 }, 2.98);
          window.__timelines = window.__timelines || {};
          window.__timelines['scene-quality'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
