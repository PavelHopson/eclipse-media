<!doctype html>
<html lang="ru">
  <head><meta charset="utf-8" /></head>
  <body>
    <template>
      <style>
        #root { --void: #030405; --ink: #f4f7fb; --signal-soft: #9dc4ff; }
        * { box-sizing: border-box; }
        #root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(circle at 76% 32%, rgba(107, 163, 255, .12), transparent 31%), var(--void); box-shadow: inset 0 0 150px rgba(0, 0, 0, .9); color: var(--ink); font-family: 'Roboto', sans-serif; }
        #root::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(107, 163, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(107, 163, 255, .035) 1px, transparent 1px); background-size: 64px 64px; opacity: .6; }
        .scene-content { position: absolute; inset: 0; display: grid; align-content: center; padding: 7vw; }
        .eyebrow { margin: 0; color: var(--signal-soft); font: 600 19px/1.2 Consolas, monospace; letter-spacing: .24em; text-transform: uppercase; }
        h2 { max-width: 1180px; margin: 25px 0 0; font-size: clamp(62px, 6vw, 112px); line-height: .95; letter-spacing: -.045em; }
        .accent { color: var(--signal-soft); }
        .source-row { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 48px; }
        .source-pill { padding: 18px 25px; border: 1px solid rgba(157, 196, 255, .25); border-radius: 12px; background: rgba(107, 163, 255, .07); color: #d9e7ff; font: 600 22px Consolas, monospace; }
        @media (max-aspect-ratio: 1 / 1) {
          .scene-content { padding: 9vw 8vw; }
          h2 { max-width: 100%; font-size: clamp(58px, 8.2vw, 88px); }
          .source-row { gap: 12px; margin-top: 34px; }
          .source-pill { padding: 14px 18px; font-size: 18px; }
        }
      </style>

      <div id="root" data-composition-id="scene-inputs" data-width="1920" data-height="1080" data-duration="3">
        <div class="scene-content">
          <p class="eyebrow">01 / Trusted inputs</p>
          <h2>Берём только то, что можно <span class="accent">проверить.</span></h2>
          <div class="source-row">
            <span class="source-pill">PULL REQUEST</span>
            <span class="source-pill">ROADMAP</span>
            <span class="source-pill">CONFIRMED MEMORY</span>
            <span class="source-pill">TEST RESULT</span>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const root = '[data-composition-id="scene-inputs"]';
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(`${root} .eyebrow`, { autoAlpha: 0, x: -25 }, { autoAlpha: 1, x: 0, duration: .5, ease: 'power3.out' }, .18);
          tl.fromTo(`${root} h2`, { autoAlpha: 0, y: 38 }, { autoAlpha: 1, y: 0, duration: .7, ease: 'expo.out' }, .32);
          tl.fromTo(`${root} .source-pill`, { autoAlpha: 0, y: 28 }, { autoAlpha: 1, y: 0, stagger: .11, duration: .5, ease: 'back.out(1.35)' }, .72);
          tl.fromTo(`${root} .source-row`, { x: 0 }, { x: 16, duration: 2.2, ease: 'sine.inOut' }, .7);
          tl.set(root, { autoAlpha: 0 }, 2.98);
          window.__timelines = window.__timelines || {};
          window.__timelines['scene-inputs'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
