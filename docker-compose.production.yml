services:
  backend:
    build:
      context: ./backend
    environment:
      ECLIPSE_MEDIA_ALLOW_REMOTE_COMPONENTS: "false"
      ECLIPSE_MEDIA_LOCAL_EDIT_ENABLED: "false"
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - downloads:/app/downloads
    restart: unless-stopped
    init: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.75
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - media_internal
      - media_egress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ECLIPSE_MEDIA_PORT:-8080}:8080"
    restart: unless-stopped
    init: true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    ulimits:
      nofile:
        soft: 2048
        hard: 2048
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - media_internal
      - media_edge

volumes:
  downloads:
    name: eclipse-media-downloads

networks:
  media_internal:
    internal: true
  media_egress:
  media_edge:
