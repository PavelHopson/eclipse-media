services:
  backend:
    build:
      context: ./backend
    environment:
      ECLIPSE_MEDIA_ALLOW_REMOTE_COMPONENTS: "false"
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - downloads:/app/downloads
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ECLIPSE_MEDIA_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  downloads:
    name: eclipse-media-downloads